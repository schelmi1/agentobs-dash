name: Publish to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release tag
        run: |
          node -e "const expected = 'refs/tags/v' + require('./package.json').version; if (process.env.GITHUB_REF !== expected) { console.error('Select tag ' + expected); process.exit(1); }"
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm publish --access public
